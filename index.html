<!-- 방문 통계와 오류 수집 — 허브와 같은 곳으로 모인다.
     GoatCounter 는 쿠키를 쓰지 않고 개인을 가려내지 않는다. 오류는 메시지·파일·줄만 보낸다. -->
<script>
(function () {
  var APP = "armsdealer";

  // 게임마다 따로 세어지게 이름을 미리 정해 둔다 (워커 게임은 경로가 다 "/" 라서 안 그러면 한 줄로 뭉친다)
  window.goatcounter = { path: APP };
  var sc = document.createElement("script");
  sc.async = true;
  sc.src = "https://gc.zgo.at/count.js";
  sc.setAttribute("data-goatcounter", "https://41ways.goatcounter.com/count");
  document.head.appendChild(sc);

  // 판 수·인원·걸린 시간 — 게임 코드에서 norara.ev("start", { n: 인원 }) 처럼 부른다.
  // 날짜·게임·이름으로 묶어 더하기만 하므로 한 판에 한 줄씩 쌓이지 않는다.
  // 지금 누가 있나 — 화면이 보이는 동안 1분에 한 번 "여기 있음"을 보낸다. 판 중인지(play)
  // 화면만 보는지(look)를 같이 싣는다. 탭마다 무작위 번호 하나뿐, 개인을 가려낼 정보는 없다.
  var sid = (function () {
    try {
      var s = sessionStorage.getItem("norara.sid");
      if (!s) { s = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); sessionStorage.setItem("norara.sid", s); }
      return s;
    } catch (e) { return Math.random().toString(36).slice(2, 14); }
  })();
  var playing = false;
  function beat(st) {
    try {
      navigator.sendBeacon("https://norara-errors.41ways.workers.dev/beat",
        JSON.stringify({ app: APP, sid: sid, st: st || (playing ? "play" : "look") }));
    } catch (e) {}
  }

  window.norara = {
    ev: function (name, o) {
      o = o || {};
      o.app = APP;
      o.ev = name;
      try {
        navigator.sendBeacon("https://norara-errors.41ways.workers.dev/ev", JSON.stringify(o));
      } catch (e) {}
      if (name === "start") window.norara.live(true);   // 판 시작·끝은 "지금" 칸에도 바로 반영
      if (name === "end") window.norara.live(false);
    },
    // 판 중인지 알린다. 방장만 판 수를 세는 온라인 게임도, 참가자는 이걸로 "판 중"에 잡힌다
    live: function (on) {
      on = !!on;
      if (on === playing) return;
      playing = on;
      if (document.visibilityState === "visible") beat();
    }
  };

  setTimeout(function () { if (document.visibilityState === "visible") beat(); }, 2000);
  setInterval(function () { if (document.visibilityState === "visible") beat(); }, 60000);
  document.addEventListener("visibilitychange", function () {
    beat(document.visibilityState === "hidden" ? "gone" : null);   // 숨기면 바로 빠지고, 돌아오면 다시 잡힌다
  });
  addEventListener("pagehide", function () { beat("gone"); });

  // 얼마나 머물렀는지 — 탭을 덮거나 닫을 때 한 번만. pagehide 만으로는 폰에서 자주 놓친다.
  var came = Date.now(), told = false;
  function leaving() {
    if (told) return;
    told = true;
    var sec = Math.round((Date.now() - came) / 1000);
    if (sec >= 5) window.norara.ev("visit", { sec: sec });   // 스쳐 간 것은 빼고
  }
  addEventListener("pagehide", leaving);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") leaving();
  });

  // 화면에서 터진 오류를 모은다. 한 번 열 때 다섯 건까지만 — 같은 오류가 쏟아져도 한도를 안 태우게.
  var left = 5;
  function send(o) {
    if (left-- <= 0) return;
    o.app = APP;
    o.page = location.pathname + location.search;
    try {
      navigator.sendBeacon("https://norara-errors.41ways.workers.dev/report", JSON.stringify(o));
    } catch (e) {}
  }
  addEventListener("error", function (e) {
    if (!e.message) return;                  // 그림·소리 파일이 안 열린 것은 뺀다
    send({ msg: e.message, src: e.filename, line: e.lineno, col: e.colno,
           stack: e.error && e.error.stack });
  });
  addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    send({ msg: "처리되지 않은 거절: " + ((r && r.message) || r), stack: r && r.stack });
  });
})();
</script>
